name: Generate Dragon Contribution Graph

on:
  schedule: # Run every 24 hours
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Dragon Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff3b00&color_dots=#161b22,#4a0e17,#8a1c14,#d63031,#ff7675
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4500&color_dots=#161b22,#3d0c02,#8a1c14,#e65c00,#ff8c00

      - name: Push Output to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
